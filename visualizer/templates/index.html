<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart City — Traffic Visualizer</title>

  <link rel="stylesheet" href="/static/leaflet.css" />
  <script src="/static/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #111; color: #e0e0e0;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 7px 14px; background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0; flex-wrap: wrap; z-index: 1000;
    }
    #topbar h1 { font-size: 14px; font-weight: 600; color: #e94560; white-space: nowrap; }
    .ctrl-group { display: flex; align-items: center; gap: 6px; }
    .ctrl-group label { font-size: 12px; color: #aaa; }
    button {
      background: #0f3460; border: 1px solid #e94560;
      color: #fff; padding: 4px 11px; border-radius: 4px;
      cursor: pointer; font-size: 13px; transition: background .15s;
    }
    button:hover { background: #e94560; }
    button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    select {
      background: #0f3460; border: 1px solid #333;
      color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 13px;
    }
    #status-bar { margin-left: auto; font-size: 12px; color: #888; white-space: nowrap; }
    #frame-info { font-size: 12px; color: #7fdbff; white-space: nowrap; }

    #map { flex: 1; width: 100%; min-height: 0; }

    #legend {
      position: absolute; bottom: 30px; right: 10px;
      background: rgba(16,20,40,.92); border: 1px solid #0f3460;
      border-radius: 6px; padding: 10px 13px; font-size: 12px;
      z-index: 1000; pointer-events: none; min-width: 140px;
    }
    #legend h3 { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
    .lr { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .cnt { margin-left: auto; font-size: 11px; color: #7fdbff; min-width: 24px; text-align: right; }
    .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; }
    .sw  { width: 13px; height: 9px; border-radius: 2px; border: 1px solid rgba(255,255,255,.3); flex-shrink: 0; }
    .sep { border-top: 1px solid #333; margin: 5px 0; }

    #buf-wrap { width: 110px; }
    #buf-bg { height: 5px; background: #333; border-radius: 3px; overflow: hidden; }
    #buf-bar { height: 100%; background: #e94560; width: 0%; transition: width .3s; }
    #buf-lbl { font-size: 10px; color: #666; margin-top: 2px; }

    /* Track-id labels (right side) */
    .tid-label {
      background: transparent !important; border: none !important; box-shadow: none !important;
      font-size: 9px; color: #fff; white-space: nowrap;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      padding: 0 2px !important;
    }
    .tid-label::before { display: none !important; }

    /* Speed labels (left side) — two lines: "old | new" then state */
    .spd-label {
      background: transparent !important; border: none !important; box-shadow: none !important;
      font-size: 11px; white-space: nowrap; line-height: 1.3;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      padding: 0 2px !important; text-align: right; width: 90px;
    }
    .spd-label::before { display: none !important; }
    .spd-old   { color: #aaa; font-size: 10px; }
    .spd-new   { color: #FFD600; }
    .spd-state-mov { color: #4CAF50; font-size: 11px; font-weight: 700; letter-spacing: .5px; }
    .spd-state-par { color: #FF5722; font-size: 11px; font-weight: 700; letter-spacing: .5px; }

    .leaflet-control-attribution {
      background: rgba(16,20,40,.8) !important;
      color: #555 !important; font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: #777 !important; }

    /* Compare panel */
    #compare-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 620px;
      background: rgba(16,20,40,.95); border-left: 1px solid #0f3460;
      z-index: 1100; display: flex; flex-direction: column; font-size: 12px;
    }
    #compare-panel.hidden { display: none; }
    #compare-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid #0f3460; flex-shrink: 0;
    }
    #compare-header h3 {
      font-size: 11px; color: #888; text-transform: uppercase;
      letter-spacing: .5px; flex: 1;
    }
    #compare-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
    .cmp-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; cursor: pointer; border-radius: 3px; }
    .cmp-row.cmp-highlight { background: rgba(233,69,96,.35); }
    .cmp-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #compare-empty { color: #666; padding: 4px 0; }
    #compare-chart-wrap {
      height: 260px; border-top: 1px solid #0f3460; padding: 6px; flex-shrink: 0;
      position: relative;
    }
    #compare-chart { width: 100%; height: 100%; display: block; }
    #btn-chart-reset {
      position: absolute; top: 8px; right: 10px; z-index: 10;
      background: rgba(15,30,60,.9); border: 1px solid #1a4a8a;
      color: #7fdbff; font-size: 10px; padding: 2px 7px; cursor: pointer;
      border-radius: 3px; display: none; line-height: 1.5;
    }
    #btn-chart-reset:hover { background: rgba(30,60,120,.9); }
  </style>
</head>
<body>

<div id="topbar">
  <h1>&#x1F6F8; Smart City Traffic Visualizer</h1>

  <div class="ctrl-group">
    <button id="btn-reverse"   title="Reproducir hacia atrás">&#9664;&#9664;</button>
    <button id="btn-pause"     title="Pausa">&#9646;&#9646;</button>
    <button id="btn-play"      title="Reproducir">&#9654;</button>
  </div>
  <div class="ctrl-group">
    <button id="btn-step-bwd" title="Frame anterior" disabled>&#9664;|</button>
    <button id="btn-step-fwd" title="Frame siguiente" disabled>|&#9654;</button>
  </div>
  <div class="ctrl-group">
    <button id="btn-restart" title="Reiniciar">&#9198;</button>
  </div>

  <div class="ctrl-group">
    <label>Velocidad</label>
    <select id="sel-speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
  </div>

  <div class="ctrl-group">
    <button id="btn-polys">Polígonos</button>
    <button id="btn-layer">🛰 Satélite</button>
    <button id="btn-ids">IDs</button>
    <button id="btn-spd">Vel.</button>
    <button id="btn-compare">📈 Comparar</button>
  </div>

  <div id="frame-info">—</div>

  <div id="buf-wrap">
    <div id="buf-bg"><div id="buf-bar"></div></div>
    <div id="buf-lbl">Buffer: 0</div>
  </div>

  <div id="status-bar">Conectando…</div>
</div>

<div id="map">
  <div id="compare-panel" class="hidden">
    <div id="compare-header">
      <h3>Comparar velocidades</h3>
      <select id="compare-filter"></select>
      <button id="btn-compare-clear" title="Limpiar selección">🗑</button>
    </div>
    <div id="compare-list"></div>
    <div id="compare-chart-wrap"><canvas id="compare-chart"></canvas><button id="btn-chart-reset" title="Restablecer zoom">⟳ Reset</button></div>
  </div>
</div>

<div id="legend">
  <h3>Clases — visibles</h3>
  <div class="lr"><div class="dot" style="background:#2196F3"></div>Coche (0)<span class="cnt" id="cnt-0">0</span></div>
  <div class="lr"><div class="dot" style="background:#F44336"></div>Peatón (1)<span class="cnt" id="cnt-1">0</span></div>
  <div class="lr"><div class="dot" style="background:#00BCD4"></div>Camión (2)<span class="cnt" id="cnt-2">0</span></div>
  <div class="lr"><div class="dot" style="background:#FF9800"></div>Autobús (3)<span class="cnt" id="cnt-3">0</span></div>
  <div class="lr"><div class="dot" style="background:#9C27B0"></div>Moto (4)<span class="cnt" id="cnt-4">0</span></div>
  <div class="lr"><div class="dot" style="background:#4CAF50"></div>Bici (5)<span class="cnt" id="cnt-5">0</span></div>
  <div class="lr"><div class="dot" style="background:#9E9E9E"></div>Otro (6)<span class="cnt" id="cnt-6">0</span></div>
  <div class="sep"></div>
  <h3>Zonas</h3>
  <div class="lr"><div class="sw" style="background:#4CAF50"></div>Carril bici</div>
  <div class="lr"><div class="sw" style="background:#F44336"></div>Carretera</div>
  <div class="lr"><div class="sw" style="background:#FFEB3B"></div>Acera</div>
  <div class="lr"><div class="sw" style="background:#2196F3"></div>Tranvía</div>
  <div class="lr"><div class="sw" style="background:#E91E63"></div>Paso peatonal</div>
  <div class="lr"><div class="sw" style="background:#FF9800"></div>Carril bus</div>
</div>

<script>
// ──────────────────────────────────────────────────────────────
//  Constants
// ──────────────────────────────────────────────────────────────
const CLASS_CFG = {
  0: { color: '#2196F3', label: 'Coche',   r: 7 },
  1: { color: '#F44336', label: 'Peatón',  r: 5 },
  2: { color: '#00BCD4', label: 'Camión',  r: 8 },
  3: { color: '#FF9800', label: 'Autobús', r: 8 },
  4: { color: '#9C27B0', label: 'Moto',    r: 6 },
  5: { color: '#4CAF50', label: 'Bici',    r: 5 },
  6: { color: '#9E9E9E', label: 'Otro',    r: 6 },
};
const POLY_CFG = {
  bikeLane:     { color: '#4CAF50', opacity: .5,  fill: .20 },
  road:         { color: '#F44336', opacity: .5,  fill: .15 },
  sidewalk:     { color: '#FFEB3B', opacity: .5,  fill: .15 },
  tramway:      { color: '#2196F3', opacity: .6,  fill: .25 },
  pedCross:     { color: '#E91E63', opacity: .6,  fill: .30 },
  busRoad:      { color: '#FF9800', opacity: .5,  fill: .15 },
  ngArea:       { color: '#212121', opacity: .7,  fill: .30 },
  carTramCross: { color: '#9C27B0', opacity: .5,  fill: .25 },
  bikeCarCross: { color: '#009688', opacity: .5,  fill: .25 },
};
const DEFAULT_POLY = { color: '#fff', opacity: .4, fill: .10 };

// ──────────────────────────────────────────────────────────────
//  Tile layers
// ──────────────────────────────────────────────────────────────
const canvasRenderer = L.canvas({ padding: 0.5 });
const map = L.map('map', { zoomControl: true });

const layerDark = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 22 }
);
const layerSat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: '&copy; Esri, Maxar, Earthstar Geographics', maxZoom: 22 }
);
const layerSatLabels = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
  { attribution: '', maxZoom: 22, opacity: 0.7 }
);

let usingSat = true;
layerSat.addTo(map);
layerSatLabels.addTo(map);

// ──────────────────────────────────────────────────────────────
//  State
// ──────────────────────────────────────────────────────────────
let appFps    = 25;
let speed     = 1.0;
let playing   = true;
let direction = 1;     // 1 = forward, -1 = backward
let showIds   = false;
let showSpds  = true;

const frameQueue  = [];
const frameIndex  = new Map();   // frame_id -> index in frameQueue
let   qHead       = 0;

const markers       = new Map();  // track_id → L.circleMarker
const trackClass    = new Map();  // track_id → class_id  (for counts)
const labelMarkers  = new Map();  // track_id → L.marker  (track_id label, right side)
const speedMarkers  = new Map();  // track_id → L.marker  (speed label, left side)
const lastSpdHtml   = new Map();  // track_id → last-rendered speed/state HTML
const missingCount  = new Map();  // track_id → consecutive frames absent
const TRACK_GRACE_FRAMES = 50;    // ~2 s @ 25 fps — tolerate brief tracker gaps
const polyLayers   = [];
let   polysVisible = true;

// Compare panel
let   comparePanelOpen = false;
let   currentFrameTs   = null;        // ts (µs) of the frame currently shown on the map
let   chartXZoom       = 1.0;         // X-axis zoom level (1 = full range)
let   chartXPan        = 0.0;         // left edge of visible window (seconds)
const compareSelected  = new Set();   // track_ids picked for comparison
const COMPARE_COLORS    = ['#FFD600','#00E5FF','#FF4081','#76FF03','#FF6E40','#B388FF','#69F0AE','#EEFF41'];
const COMPARE_COLORS_KF = ['#FF6B6B','#4FC3F7','#CE93D8','#A5D6A7','#FFB74D','#90CAF9','#F48FB1','#FFF176'];
function compareColor(id) {
  const idx = [...compareSelected].indexOf(id);
  return COMPARE_COLORS[Math.max(0, idx) % COMPARE_COLORS.length];
}
function compareColorKF(id) {
  const idx = [...compareSelected].indexOf(id);
  return COMPARE_COLORS_KF[Math.max(0, idx) % COMPARE_COLORS_KF.length];
}

function formatFrameTs(tsUs) {
  return new Date(tsUs / 1000).toISOString().slice(11, 19) + ' UTC';
}

let lastFrameTs = null;
let realTimeRef = null;

// ──────────────────────────────────────────────────────────────
//  Polygons
// ──────────────────────────────────────────────────────────────
function drawPolygons(polygons) {
  polyLayers.forEach(l => map.removeLayer(l));
  polyLayers.length = 0;
  polygons.forEach(p => {
    const cfg     = POLY_CFG[p.type] || DEFAULT_POLY;
    const latlngs = p.coords.map(c => [c.lat, c.lng]);
    const layer   = L.polygon(latlngs, {
      color: cfg.color, opacity: cfg.opacity, weight: 2,
      fillColor: cfg.color, fillOpacity: cfg.fill,
      interactive: false, // don't steal hover from the car markers above them
    });
    if (polysVisible) layer.addTo(map);
    polyLayers.push(layer);
  });
}

// ──────────────────────────────────────────────────────────────
//  Class counters
// ──────────────────────────────────────────────────────────────
function updateCounts() {
  const counts = {};
  trackClass.forEach(cls => { counts[cls] = (counts[cls] || 0) + 1; });
  for (let c = 0; c <= 6; c++) {
    const el = document.getElementById(`cnt-${c}`);
    if (el) el.textContent = counts[c] || 0;
  }
}

// ──────────────────────────────────────────────────────────────
//  Frame rendering  — markers stored as plain L.circleMarker (unchanged)
// ──────────────────────────────────────────────────────────────
function renderFrame(frame) {
  const activeIds = new Set(frame.objects.map(o => o.track_id));

  markers.forEach((marker, id) => {
    if (activeIds.has(id)) {
      missingCount.delete(id);
      return;
    }
    // The tracker can drop a track_id for a few frames (occlusion, missed
    // detection) and pick it back up later — tolerate brief gaps so markers
    // don't blink and Comparar selections aren't silently lost.
    const missed = (missingCount.get(id) || 0) + 1;
    if (missed < TRACK_GRACE_FRAMES) {
      missingCount.set(id, missed);
      return;
    }
    missingCount.delete(id);
    marker.remove();
    const lbl = labelMarkers.get(id);
    if (lbl) { lbl.remove(); labelMarkers.delete(id); }
    const spd = speedMarkers.get(id);
    if (spd) { spd.remove(); speedMarkers.delete(id); }
    trackClass.delete(id);
    lastSpdHtml.delete(id);
    compareSelected.delete(id);
    markers.delete(id);
  });

  frame.objects.forEach(obj => {
    const ll  = [obj.lat, obj.lng];
    const cls = CLASS_CFG[obj.class_id] ?? CLASS_CFG[6];

    const spdVal   = obj.kf_speed != null ? `${obj.kf_speed.toFixed(1)} km/h` : (obj.speed != null ? `${obj.speed.toFixed(1)} km/h` : '–');
    const refVal   = obj.ref_speed === 'nan' ? 'NAN'
                    : obj.ref_speed != null   ? `${obj.ref_speed.toFixed(1)} km/h`
                    : '–';
    const stateVal = obj.state;
    const stateCls = stateVal === 1 ? 'spd-state-par' : 'spd-state-mov';
    const stateTxt = stateVal === 1 ? 'PAR' : (stateVal === 0 ? 'MOV' : '');
    const stateRow = stateTxt ? `<br><span class="${stateCls}">${stateTxt}</span>` : '';
    const refRow   = `<span class="spd-old">input: ${refVal}</span><br>`;
    const spdHtml  = `${refRow}<span class="spd-new">${spdVal}</span>${stateRow}`;
    lastSpdHtml.set(obj.track_id, spdHtml);

    if (markers.has(obj.track_id)) {
      markers.get(obj.track_id).setLatLng(ll);
      const lbl = labelMarkers.get(obj.track_id);
      if (lbl) lbl.setLatLng(ll);
      const spdMkr = speedMarkers.get(obj.track_id);
      if (spdMkr) {
        spdMkr.setLatLng(ll);
        spdMkr.setIcon(L.divIcon({
          className: 'spd-label', html: spdHtml,
          iconSize: [90, 42], iconAnchor: [92, 21],
        }));
      }
    } else {
      const m = L.circleMarker(ll, {
        renderer:    canvasRenderer,
        radius:      cls.r,
        color:       '#fff',
        weight:      1.5,
        fillColor:   cls.color,
        fillOpacity: 1,
      })
      .bindTooltip(
        `${cls.label} #${obj.track_id}<br>${spdVal} (input: ${refVal}) · ${stateTxt} · ${obj.poly_type}`,
        { sticky: true }
      )
      .on('mouseover', () => highlightCompareRow(obj.track_id, true))
      .on('mouseout',  () => highlightCompareRow(obj.track_id, false))
      .addTo(map);
      markers.set(obj.track_id, m);
      trackClass.set(obj.track_id, obj.class_id);

      if (showIds) {
        const lbl = L.marker(ll, {
          icon: L.divIcon({ className: 'tid-label', html: String(obj.track_id),
                            iconSize: null, iconAnchor: [-2, 7] }),
          interactive: false,
        }).addTo(map);
        labelMarkers.set(obj.track_id, lbl);
      }

      if (showSpds) {
        const spdMkr = L.marker(ll, {
          icon: L.divIcon({ className: 'spd-label', html: spdHtml,
                            iconSize: [90, 42], iconAnchor: [92, 21] }),
          interactive: false,
        }).addTo(map);
        speedMarkers.set(obj.track_id, spdMkr);
      }
    }
  });

  const tsMs  = frame.ts / 1000;
  const tsStr = new Date(tsMs).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  document.getElementById('frame-info').textContent =
    `Frame ${frame.frame_id} · ${frame.objects.length} obj · ${tsStr}`;
  currentFrameTs = frame.ts;

  updateCounts();

  if (comparePanelOpen) {
    refreshCompareList();
    drawCompareChart();
  }
}

// ──────────────────────────────────────────────────────────────
//  Compare panel
// ──────────────────────────────────────────────────────────────
function buildTrackSeries(trackId) {
  const t = [], speed = [], ref = [], rawSpeed = [], checkpoints = [], kfSpeed = [];
  let t0 = null;
  let lastRef = null;
  for (const frame of frameQueue) {
    const obj = frame.objects.find(o => o.track_id === trackId);
    if (obj && obj.speed != null) {
      if (t0 === null) t0 = frame.ts;
      t.push((frame.ts - t0) / 1e6);
      speed.push(obj.speed);
      const rv = (obj.ref_speed != null && obj.ref_speed !== 'nan') ? obj.ref_speed : null;
      if (rv != null) lastRef = rv;
      ref.push(lastRef);
      rawSpeed.push(obj.raw_speed ?? null);
      checkpoints.push(obj.checkpoint_speed ?? null);
      kfSpeed.push(obj.kf_speed ?? null);
    }
  }
  return { t, speed, ref, rawSpeed, checkpoints, kfSpeed, t0 };
}

function highlightCompareRow(trackId, on) {
  const row = document.querySelector(`#compare-list .cmp-row[data-id="${trackId}"]`);
  if (row) row.classList.toggle('cmp-highlight', on);
}

function refreshCompareList() {
  const listEl = document.getElementById('compare-list');
  const filter = document.getElementById('compare-filter').value;
  let ids = [...markers.keys()].sort((a, b) => a - b);
  if (filter !== 'all') {
    const filterCls = parseInt(filter, 10);
    ids = ids.filter(id => trackClass.get(id) === filterCls);
  }

  if (ids.length === 0) {
    listEl.innerHTML = '<div id="compare-empty">Sin coches visibles</div>';
    return;
  }

  const empty = document.getElementById('compare-empty');
  if (empty) empty.remove();

  // Drop rows for tracks no longer visible/filtered out.
  const idSet = new Set(ids);
  listEl.querySelectorAll('.cmp-row').forEach(row => {
    if (!idSet.has(parseInt(row.dataset.id, 10))) row.remove();
  });

  // Add missing rows / update existing ones, in `ids` order.
  ids.forEach(id => {
    let row = listEl.querySelector(`.cmp-row[data-id="${id}"]`);
    if (!row) {
      row = document.createElement('label');
      row.className = 'cmp-row';
      row.dataset.id = id;
      row.innerHTML = `
        <input type="checkbox" data-id="${id}">
        <span class="sw"></span>
        <span class="cmp-label"></span>
      `;
      row.querySelector('input').addEventListener('change', e => {
        const tid = parseInt(e.target.dataset.id, 10);
        if (e.target.checked) compareSelected.add(tid);
        else compareSelected.delete(tid);
        refreshCompareList();
        drawCompareChart();
      });
    }

    const cls      = CLASS_CFG[trackClass.get(id)] ?? CLASS_CFG[6];
    const selected = compareSelected.has(id);
    row.querySelector('input').checked = selected;
    row.querySelector('.sw').style.cssText = selected ? `background:${compareColor(id)}` : '';
    row.querySelector('.cmp-label').textContent = `${cls.label} #${id}`;

    listEl.appendChild(row); // (re)append → keeps DOM order matching `ids`
  });
}

function resetChartZoom() {
  chartXZoom = 1.0;
  chartXPan  = 0.0;
  const canvas = document.getElementById('compare-chart');
  canvas.style.cursor = 'default';
  document.getElementById('btn-chart-reset').style.display = 'none';
  drawCompareChart();
}

function drawCompareChart() {
  const canvas = document.getElementById('compare-chart');
  const ctx    = canvas.getContext('2d');
  const w = canvas.width  = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  if (compareSelected.size === 0) {
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.fillText('Selecciona uno o más coches', 8, 20);
    return;
  }

  const allSeries = [...compareSelected].map(id => ({ id, ...buildTrackSeries(id) }));
  const series    = allSeries.filter(s => s.t.length >= 2);

  ctx.fillStyle = '#888';
  ctx.font = '10px sans-serif';
  ctx.fillText(`Seleccionados: ${compareSelected.size}`, 8, 10);
  if (currentFrameTs != null) {
    ctx.fillStyle = '#7fdbff';
    ctx.fillText(formatFrameTs(currentFrameTs), 100, 10);
  }

  if (series.length === 0) {
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.fillText('Esperando datos de velocidad…', 8, 26);
    return;
  }

  let tMax = 0, vMax = 1;
  series.forEach(s => {
    tMax = Math.max(tMax, s.t[s.t.length - 1]);
    s.speed.forEach(v => { if (v > vMax) vMax = v; });
    s.ref.forEach(v => { if (v != null && v > vMax) vMax = v; });
    s.checkpoints.forEach(v => { if (v != null && v > vMax) vMax = v; });
    s.rawSpeed.forEach(v => { if (v != null && v > vMax) vMax = v; });
    s.kfSpeed.forEach(v => { if (v != null && v > vMax) vMax = v; });
  });
  vMax = Math.max(5, Math.ceil((vMax * 1.1) / 5) * 5);
  if (tMax <= 0) tMax = 1;

  // Zoom/pan: clamp pan so window stays within [0, tMax]
  const visibleDur = tMax / chartXZoom;
  chartXPan = Math.max(0, Math.min(chartXPan, tMax - visibleDur));
  const xStart = chartXPan;
  const xEnd   = xStart + visibleDur;

  const padL = 28, padR = 6, padT = 6, padB = 16;
  const plotW = Math.max(1, w - padL - padR);
  const plotH = Math.max(1, h - padT - padB);
  const x = t => padL + ((t - xStart) / visibleDur) * plotW;
  const y = v => padT + plotH - (v / vMax) * plotH;

  // "Now" position: where currentFrameTs falls within this series' time axis.
  // Uses the first series' t0 as reference (works correctly for single-car
  // selection; for multi-car it's approximate but good enough when cars appear
  // at similar times).
  const nowT = (currentFrameTs != null && series.length > 0 && series[0].t0 != null)
    ? (currentFrameTs - series[0].t0) / 1e6
    : null;

  ctx.strokeStyle = '#333'; ctx.fillStyle = '#888'; ctx.font = '10px sans-serif';
  const ySteps = 5;
  for (let i = 0; i <= ySteps; i++) {
    const v  = (vMax / ySteps) * i;
    const yy = y(v);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(v.toFixed(0), 2, yy + 3);
  }
  const xSteps = 4;
  for (let i = 0; i <= xSteps; i++) {
    const t = xStart + (visibleDur / xSteps) * i;
    ctx.fillText(t.toFixed(0) + 's', x(t) - 8, h - 4);
  }

  // Each car gets two curves in its own color: the computed speed (solid)
  // and the CSV/input reference speed (dashed). The ref series can have
  // gaps (null) — break the line instead of connecting across them.
  series.forEach(s => {
    ctx.strokeStyle = compareColor(s.id);
    ctx.lineWidth   = 1.5;

    ctx.setLineDash([]);
    ctx.beginPath();
    s.t.forEach((t, i) => {
      const px = x(t), py = y(s.speed[i]);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();

    ctx.setLineDash([5, 3]);
    ctx.beginPath();
    let drawing = false;
    s.t.forEach((t, i) => {
      const v = s.ref[i];
      if (v == null) { drawing = false; return; }
      const px = x(t), py = y(v);
      if (!drawing) { ctx.moveTo(px, py); drawing = true; } else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // Kalman CV line — dot-dash, distinct colour
    ctx.strokeStyle = compareColorKF(s.id);
    ctx.setLineDash([8, 3, 2, 3]);
    ctx.beginPath();
    let drawingKF = false;
    s.t.forEach((t, i) => {
      const v = s.kfSpeed[i];
      if (v == null) { drawingKF = false; return; }
      const px = x(t), py = y(v);
      if (!drawingKF) { ctx.moveTo(px, py); drawingKF = true; } else ctx.lineTo(px, py);
    });
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // Raw per-frame speed → small × marks; checkpoint speed → small ○ marks.
  series.forEach(s => {
    const color = compareColor(s.id);
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1;

    s.t.forEach((ti, i) => {
      const v = s.rawSpeed[i];
      if (v == null) return;
      const cx = x(ti), cy = y(v), r = 3;
      ctx.beginPath();
      ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
      ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
      ctx.stroke();
    });

    s.t.forEach((ti, i) => {
      const v = s.checkpoints[i];
      if (v == null) return;
      ctx.beginPath();
      ctx.arc(x(ti), y(v), 4, 0, 2 * Math.PI);
      ctx.stroke();
    });
  });

  // "Now" marker: vertical line at the map's current frame position.
  // Moves left/right as the user steps forward/backward through frames.
  if (nowT != null && nowT >= xStart && nowT <= xEnd) {
    const nowX = x(nowT);
    ctx.strokeStyle = '#7fdbff';
    ctx.lineWidth   = 1;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(nowX, padT);
    ctx.lineTo(nowX, h - padB);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#7fdbff';
    ctx.font = '9px sans-serif';
    ctx.fillText('▼', nowX - 3, padT + 8);
  }

  // Legend: three rows per car — solid=SG, dashed=input CSV, dot-dash=KalmanCV
  ctx.font = '10px sans-serif';
  allSeries.forEach((s, idx) => {
    const color   = compareColor(s.id);
    const colorKF = compareColorKF(s.id);
    const y0 = 10 + idx * 33;

    // Row 1: SG
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(w - 92, y0 - 3); ctx.lineTo(w - 78, y0 - 3); ctx.stroke();
    ctx.fillStyle = '#ccc';
    const calcLabel = s.t.length >= 2
      ? `#${s.id} SG: ${s.speed[s.speed.length - 1].toFixed(1)} km/h`
      : `#${s.id}: esperando…`;
    ctx.fillText(calcLabel, w - 75, y0);

    if (s.t.length >= 2) {
      // Row 2: input CSV
      const lastRef = [...s.ref].reverse().find(v => v != null);
      ctx.strokeStyle = color;
      ctx.setLineDash([3, 2]);
      ctx.beginPath(); ctx.moveTo(w - 92, y0 + 9); ctx.lineTo(w - 78, y0 + 9); ctx.stroke();
      ctx.fillStyle = '#ccc';
      const refLabel = lastRef != null ? `input: ${lastRef.toFixed(1)} km/h` : 'input: –';
      ctx.fillText(refLabel, w - 75, y0 + 12);

      // Row 3: Kalman CV
      const lastKF = [...s.kfSpeed].reverse().find(v => v != null);
      ctx.strokeStyle = colorKF;
      ctx.setLineDash([8, 3, 2, 3]);
      ctx.beginPath(); ctx.moveTo(w - 92, y0 + 20); ctx.lineTo(w - 78, y0 + 20); ctx.stroke();
      ctx.fillStyle = colorKF;
      const kfLabel = lastKF != null ? `KF: ${lastKF.toFixed(1)} km/h` : 'KF: –';
      ctx.fillText(kfLabel, w - 75, y0 + 23);
    }
  });
  ctx.setLineDash([]);
}

// ──────────────────────────────────────────────────────────────
//  Render loop
// ──────────────────────────────────────────────────────────────
function renderLoop(now) {
  requestAnimationFrame(renderLoop);
  if (!playing) return;
  if (direction ===  1 && qHead >= frameQueue.length) return;
  if (direction === -1 && qHead <= 0) return;

  const frameIdx = direction === 1 ? qHead : qHead - 1;
  const frame    = frameQueue[frameIdx];

  if (lastFrameTs === null) {
    realTimeRef = now;
    lastFrameTs = frame.ts;
  } else {
    const simDeltaMs = Math.abs(frame.ts - lastFrameTs) / 1000 / speed;
    if (now - realTimeRef < simDeltaMs) return;
  }

  realTimeRef  = now;
  lastFrameTs  = frame.ts;
  qHead       += direction;

  renderFrame(frame);
  updateBuf();
}
requestAnimationFrame(renderLoop);

// ──────────────────────────────────────────────────────────────
//  WebSocket
// ──────────────────────────────────────────────────────────────
let ws;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen  = () => setStatus('Conectado ●');
  ws.onclose = () => { setStatus('Reconectando…'); setTimeout(connectWS, 3000); };
  ws.onerror = () => setStatus('Error WS');

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'init') {
      appFps = msg.fps || 25;
      map.setView([msg.ref_lat, msg.ref_lon], 18);
      drawPolygons(msg.polygons || []);
      console.log('[viz] init ref:', msg.ref_lat, msg.ref_lon, 'polys:', (msg.polygons||[]).length);
    } else if (msg.type === 'frame') {
      ingest(msg);
    } else if (msg.type === 'ping') {
      ws.send('{"type":"pong"}');
    }
    updateBuf();
    if (frameQueue.length > 0)
      setStatus(`Conectado ● ${frameQueue.length} frames`);
  };
}

function ingest(frame) {
  // Live frames take precedence over a previously-loaded runs/ batch frame
  // with the same frame_id — replace it so the live speed is shown.
  if (frameIndex.has(frame.frame_id)) {
    frameQueue[frameIndex.get(frame.frame_id)] = frame;
    return;
  }
  frameIndex.set(frame.frame_id, frameQueue.length);
  frameQueue.push(frame);
  if (frameQueue.length > 1 &&
      frame.frame_id < frameQueue[frameQueue.length - 2].frame_id) {
    frameQueue.sort((a, b) => a.frame_id - b.frame_id);
    frameIndex.clear();
    frameQueue.forEach((f, i) => frameIndex.set(f.frame_id, i));
  }
}

// ──────────────────────────────────────────────────────────────
//  Controls
// ──────────────────────────────────────────────────────────────
function setStatus(s) { document.getElementById('status-bar').textContent = s; }

function updateBuf() {
  const rem = frameQueue.length - qHead;
  document.getElementById('buf-bar').style.width = Math.min(100, rem / 200) + '%';
  document.getElementById('buf-lbl').textContent = `Buffer: ${rem}`;
}

function setStepButtons() {
  const paused = !playing;
  document.getElementById('btn-step-fwd').disabled = !paused;
  document.getElementById('btn-step-bwd').disabled = !paused;
}

document.getElementById('btn-reverse').addEventListener('click', () => {
  direction   = -1;
  playing     = true;
  lastFrameTs = null;
  realTimeRef = null;
  setStepButtons();
});

document.getElementById('btn-pause').addEventListener('click', () => {
  playing = !playing;
  lastFrameTs = null;
  realTimeRef = null;
  setStepButtons();
});

document.getElementById('btn-play').addEventListener('click', () => {
  direction   = 1;
  playing     = true;
  lastFrameTs = null;
  realTimeRef = null;
  setStepButtons();
});

document.getElementById('btn-step-fwd').addEventListener('click', () => {
  if (qHead < frameQueue.length) {
    const frame = frameQueue[qHead];
    lastFrameTs = frame.ts;
    realTimeRef = performance.now();
    qHead++;
    renderFrame(frame);
    updateBuf();
  }
});

document.getElementById('btn-step-bwd').addEventListener('click', () => {
  if (qHead > 0) {
    qHead--;
    const frame = frameQueue[qHead];
    lastFrameTs = frame.ts;
    realTimeRef = performance.now();
    renderFrame(frame);
    updateBuf();
  }
});

document.getElementById('btn-restart').addEventListener('click', () => {
  qHead = 0; lastFrameTs = null; realTimeRef = null;
  direction = 1; playing = true;
  setStepButtons();
  markers.forEach(m => m.remove());      markers.clear();
  labelMarkers.forEach(l => l.remove()); labelMarkers.clear();
  speedMarkers.forEach(s => s.remove()); speedMarkers.clear();
  trackClass.clear(); lastSpdHtml.clear(); missingCount.clear();
  compareSelected.clear();
  updateBuf(); updateCounts();
});

document.getElementById('sel-speed').addEventListener('change', e => {
  speed = parseFloat(e.target.value);
  realTimeRef = performance.now();
});

document.getElementById('btn-polys').addEventListener('click', () => {
  polysVisible = !polysVisible;
  polyLayers.forEach(l => polysVisible ? l.addTo(map) : map.removeLayer(l));
});

document.getElementById('btn-layer').addEventListener('click', () => {
  usingSat = !usingSat;
  if (usingSat) {
    map.removeLayer(layerDark);
    layerSat.addTo(map);
    layerSatLabels.addTo(map);
    document.getElementById('btn-layer').textContent = '🌑 Oscuro';
  } else {
    map.removeLayer(layerSat);
    map.removeLayer(layerSatLabels);
    layerDark.addTo(map);
    document.getElementById('btn-layer').textContent = '🛰 Satélite';
  }
});

document.getElementById('btn-ids').addEventListener('click', () => {
  showIds = !showIds;
  document.getElementById('btn-ids').style.background = showIds ? '#e94560' : '';
  labelMarkers.forEach(l => l.remove()); labelMarkers.clear();
  if (showIds) {
    markers.forEach((m, id) => {
      const lbl = L.marker(m.getLatLng(), {
        icon: L.divIcon({ className: 'tid-label', html: String(id),
                          iconSize: null, iconAnchor: [-2, 7] }),
        interactive: false,
      }).addTo(map);
      labelMarkers.set(id, lbl);
    });
  }
});

document.getElementById('btn-spd').addEventListener('click', () => {
  showSpds = !showSpds;
  document.getElementById('btn-spd').style.background = showSpds ? '#e94560' : '';
  speedMarkers.forEach(s => s.remove()); speedMarkers.clear();
  if (showSpds) {
    markers.forEach((m, id) => {
      const spdMkr = L.marker(m.getLatLng(), {
        icon: L.divIcon({ className: 'spd-label', html: lastSpdHtml.get(id) || '',
                          iconSize: [90, 42], iconAnchor: [92, 21] }),
        interactive: false,
      }).addTo(map);
      speedMarkers.set(id, spdMkr);
    });
  }
});

document.getElementById('btn-compare').addEventListener('click', () => {
  comparePanelOpen = !comparePanelOpen;
  document.getElementById('btn-compare').style.background = comparePanelOpen ? '#e94560' : '';
  document.getElementById('compare-panel').classList.toggle('hidden', !comparePanelOpen);
  if (comparePanelOpen) {
    refreshCompareList();
    drawCompareChart();
  }
});

document.getElementById('btn-compare-clear').addEventListener('click', () => {
  compareSelected.clear();
  chartXZoom = 1.0; chartXPan = 0.0;
  document.getElementById('btn-chart-reset').style.display = 'none';
  document.getElementById('compare-chart').style.cursor = 'default';
  refreshCompareList();
  drawCompareChart();
});

document.getElementById('compare-filter').addEventListener('change', () => {
  refreshCompareList();
});

window.addEventListener('resize', () => {
  if (comparePanelOpen) drawCompareChart();
});

// ── Chart zoom (scroll wheel) + pan (drag) ────────────────────
(function () {
  const canvas = document.getElementById('compare-chart');
  let dragState = null;

  function getSeriesTMax() {
    const s = [...compareSelected].map(id => buildTrackSeries(id)).filter(s => s.t.length >= 2);
    let tMax = 0;
    s.forEach(s => { tMax = Math.max(tMax, s.t[s.t.length - 1]); });
    return tMax > 0 ? tMax : null;
  }

  canvas.addEventListener('wheel', function (e) {
    if (!comparePanelOpen || compareSelected.size === 0) return;
    e.preventDefault();
    const tMax = getSeriesTMax();
    if (tMax === null) return;

    const padL = 28, padR = 6;
    const plotW = Math.max(1, canvas.clientWidth - padL - padR);
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const visibleDur = tMax / chartXZoom;
    const tAtMouse = chartXPan + ((mouseX - padL) / plotW) * visibleDur;

    chartXZoom = Math.max(1, Math.min(chartXZoom * (e.deltaY < 0 ? 1.3 : 1 / 1.3), 50));

    const newVis = tMax / chartXZoom;
    chartXPan = tAtMouse - ((mouseX - padL) / plotW) * newVis;
    chartXPan = Math.max(0, Math.min(chartXPan, tMax - newVis));

    const zoomed = chartXZoom > 1.01;
    document.getElementById('btn-chart-reset').style.display = zoomed ? 'block' : 'none';
    canvas.style.cursor = zoomed ? 'grab' : 'default';
    drawCompareChart();
  }, { passive: false });

  canvas.addEventListener('mousedown', function (e) {
    if (chartXZoom <= 1.01) return;
    dragState = { startX: e.clientX, startPan: chartXPan };
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!dragState) return;
    const tMax = getSeriesTMax();
    if (tMax === null) { dragState = null; return; }
    const padL = 28, padR = 6;
    const plotW = Math.max(1, canvas.clientWidth - padL - padR);
    const visibleDur = tMax / chartXZoom;
    chartXPan = dragState.startPan - (e.clientX - dragState.startX) * (visibleDur / plotW);
    chartXPan = Math.max(0, Math.min(chartXPan, tMax - visibleDur));
    drawCompareChart();
  });

  document.addEventListener('mouseup', function () {
    if (!dragState) return;
    dragState = null;
    canvas.style.cursor = chartXZoom > 1.01 ? 'grab' : 'default';
  });
})();

document.getElementById('btn-chart-reset').addEventListener('click', resetChartZoom);

// ──────────────────────────────────────────────────────────────
//  Bootstrap
// ──────────────────────────────────────────────────────────────
document.getElementById('btn-spd').style.background = showSpds ? '#e94560' : '';

{
  const filterSel = document.getElementById('compare-filter');
  filterSel.innerHTML = '<option value="all">Todas las clases</option>' +
    Object.entries(CLASS_CFG).map(([id, c]) => `<option value="${id}">${c.label}</option>`).join('');
  filterSel.value = '0'; // Coche
}

(async () => {
  try {
    const cfg = await (await fetch('/api/config')).json();
    appFps = cfg.fps || 25;
    map.setView([cfg.ref_lat, cfg.ref_lon], 18);
    drawPolygons(cfg.polygons || []);
  } catch (e) {
    setStatus('Error config: ' + e.message);
  }
  connectWS();
})();
</script>
